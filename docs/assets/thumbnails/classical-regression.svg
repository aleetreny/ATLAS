<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#f1f3f3" />
  <!-- grid -->
  <g stroke="#232f3e" stroke-opacity="0.075">
    <line x1="60" y1="40" x2="60" y2="250" /><line x1="130" y1="40" x2="130" y2="250" />
    <line x1="200" y1="40" x2="200" y2="250" /><line x1="270" y1="40" x2="270" y2="250" />
    <line x1="340" y1="40" x2="340" y2="250" />
    <line x1="40" y1="60" x2="360" y2="60" /><line x1="40" y1="110" x2="360" y2="110" />
    <line x1="40" y1="160" x2="360" y2="160" /><line x1="40" y1="210" x2="360" y2="210" />
  </g>
  <!-- axes -->
  <g stroke="#232f3e" stroke-width="2">
    <line x1="40" y1="250" x2="360" y2="250" />
    <line x1="40" y1="250" x2="40" y2="40" />
  </g>
  <!-- the banana-shaped cloud (mpg vs horsepower) -->
  <g fill="#d4dada" stroke="#232f3e" stroke-width="1">
    <circle cx="70" cy="75" r="6" /><circle cx="85" cy="95" r="6" />
    <circle cx="95" cy="70" r="6" /><circle cx="105" cy="110" r="6" />
    <circle cx="118" cy="90" r="6" /><circle cx="130" cy="130" r="6" />
    <circle cx="142" cy="115" r="6" /><circle cx="155" cy="150" r="6" />
    <circle cx="170" cy="135" r="6" /><circle cx="185" cy="170" r="6" />
    <circle cx="200" cy="160" r="6" /><circle cx="215" cy="190" r="6" />
    <circle cx="232" cy="180" r="6" /><circle cx="250" cy="205" r="6" />
    <circle cx="270" cy="195" r="6" /><circle cx="290" cy="215" r="6" />
    <circle cx="312" cy="210" r="6" /><circle cx="335" cy="222" r="6" />
  </g>
  <!-- rigid OLS line, missing the curve -->
  <line x1="55" y1="60" x2="355" y2="245" stroke="#232f3e" stroke-width="3" stroke-dasharray="8 6" />
  <!-- the polynomial bending through -->
  <path d="M60,80 C140,135 220,195 350,215" fill="none" stroke="#ff9900" stroke-width="4.5" />
  <!-- one big residual highlighted -->
  <line x1="95" y1="70" x2="95" y2="85" stroke="#df2a5d" stroke-width="2.5" />
</svg>
