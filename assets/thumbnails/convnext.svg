<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#f1f3f3" />
  <!-- an ablation table with its noise floor drawn on it: most bars vanish inside -->
  <rect x="62" y="118" width="286" height="42" fill="#8a94a6" fill-opacity="0.2" />
  <line x1="62" y1="139" x2="348" y2="139" stroke="#232f3e" stroke-width="1.4" />
  <g fill="#b45309">
    <rect x="70" y="128" width="18" height="11" />
    <rect x="96" y="139" width="18" height="8" />
    <rect x="122" y="96" width="18" height="43" />
    <rect x="174" y="130" width="18" height="9" />
    <rect x="200" y="139" width="18" height="12" />
    <rect x="226" y="133" width="18" height="6" />
    <rect x="278" y="139" width="18" height="7" />
    <rect x="304" y="136" width="18" height="3" />
  </g>
  <!-- the two that break out of the band, marked -->
  <rect x="148" y="139" width="18" height="47" fill="#b91c1c" />
  <rect x="252" y="103" width="18" height="36" fill="#b45309" />
  <g stroke="#232f3e" stroke-width="1.6" fill="none">
    <rect x="122" y="96" width="18" height="43" />
    <rect x="148" y="139" width="18" height="47" />
  </g>
  <text x="205" y="112" font-family="monospace" font-size="10" fill="#5b6572" text-anchor="middle">one random seed</text>
  <text x="205" y="212" font-family="monospace" font-size="11" fill="#232f3e" text-anchor="middle">eleven changes, one at a time</text>
  <g stroke="#232f3e" stroke-width="2">
    <line x1="40" y1="275" x2="360" y2="275" />
    <line x1="40" y1="275" x2="40" y2="25" />
  </g>
</svg>
