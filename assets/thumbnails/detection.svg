<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#f1f3f3" />
  <!-- left: what the grid proposes, three shapes at every cell -->
  <rect x="44" y="80" width="140" height="140" fill="#1a2432" />
  <g stroke="#7ce8f4" stroke-width="0.7" stroke-opacity="0.35">
    <path d="M61.5 80 V220 M79 80 V220 M96.5 80 V220 M114 80 V220 M131.5 80 V220 M149 80 V220 M166.5 80 V220" />
    <path d="M44 97.5 H184 M44 115 H184 M44 132.5 H184 M44 150 H184 M44 167.5 H184 M44 185 H184 M44 202.5 H184" />
  </g>
  <!-- two garments, schematically -->
  <path d="M72 96 h26 l-4 56 h-8 l-3 -34 l-3 34 h-8 z" fill="#e7ebec" />
  <rect x="120" y="158" width="46" height="34" rx="3" fill="#e7ebec" />
  <path d="M132 158 q11 -14 22 0" fill="none" stroke="#e7ebec" stroke-width="3" />
  <!-- the pile of candidates before anything is suppressed -->
  <g fill="none" stroke="#0891b2" stroke-width="1.6" stroke-opacity="0.55">
    <rect x="65" y="90" width="40" height="66" />
    <rect x="70" y="99" width="26" height="58" />
    <rect x="60" y="103" width="46" height="44" />
    <rect x="75" y="86" width="30" height="72" />
    <rect x="114" y="152" width="58" height="46" />
    <rect x="122" y="160" width="40" height="30" />
    <rect x="110" y="147" width="66" height="36" />
  </g>
  <!-- suppression -->
  <path d="M196 150 H228" fill="none" stroke="#232f3e" stroke-width="2" />
  <path d="M222 144 L230 150 L222 156" fill="none" stroke="#232f3e" stroke-width="2" />
  <!-- right: one box per object -->
  <rect x="240" y="80" width="140" height="140" fill="#1a2432" />
  <path d="M268 96 h26 l-4 56 h-8 l-3 -34 l-3 34 h-8 z" fill="#e7ebec" />
  <rect x="316" y="158" width="46" height="34" rx="3" fill="#e7ebec" />
  <path d="M328 158 q11 -14 22 0" fill="none" stroke="#e7ebec" stroke-width="3" />
  <g fill="none" stroke="#0891b2" stroke-width="2.6">
    <rect x="266" y="94" width="30" height="60" />
    <rect x="313" y="155" width="52" height="40" />
  </g>
  <text x="200" y="252" font-family="monospace" font-size="11" fill="#232f3e" text-anchor="middle">192 boxes proposed, one kept per object</text>
  <g stroke="#232f3e" stroke-width="2">
    <line x1="20" y1="275" x2="380" y2="275" />
    <line x1="20" y1="275" x2="20" y2="40" />
  </g>
</svg>
