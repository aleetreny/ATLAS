<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#f1f3f3" />
  <!-- the epsilon tube around a bending fit -->
  <path d="M 52 78 C 130 96, 190 150, 244 196 C 286 230, 330 246, 356 250
           L 356 210 C 330 206, 286 190, 244 156 C 190 110, 130 56, 52 38 Z"
        fill="#475569" fill-opacity="0.16" />
  <path d="M 52 58 C 130 76, 190 130, 244 176 C 286 210, 330 226, 356 230"
        fill="none" stroke="#475569" stroke-width="4" />
  <!-- free riders inside the tube -->
  <g fill="#b9c2c6" stroke="#232f3e" stroke-width="0.7">
    <circle cx="84" cy="70" r="4.5" /><circle cx="122" cy="82" r="4.5" />
    <circle cx="158" cy="106" r="4.5" /><circle cx="196" cy="136" r="4.5" />
    <circle cx="238" cy="168" r="4.5" /><circle cx="282" cy="200" r="4.5" />
    <circle cx="318" cy="216" r="4.5" /><circle cx="106" cy="60" r="4.5" />
    <circle cx="176" cy="128" r="4.5" /><circle cx="262" cy="192" r="4.5" />
  </g>
  <!-- the payroll: support vectors on and outside the wall -->
  <g fill="#df2a5d" stroke="#232f3e" stroke-width="1.2">
    <circle cx="70" cy="36" r="5.5" /><circle cx="150" cy="140" r="5.5" />
    <circle cx="216" cy="112" r="5.5" /><circle cx="270" cy="240" r="5.5" />
    <circle cx="336" cy="204" r="5.5" />
  </g>
  <g stroke="#232f3e" stroke-width="2">
    <line x1="40" y1="275" x2="360" y2="275" />
    <line x1="40" y1="275" x2="40" y2="25" />
  </g>
</svg>
