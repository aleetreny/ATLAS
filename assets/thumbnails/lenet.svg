<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#f1f3f3" />
  <!-- the input: a grid of pixels with a stroke running through it -->
  <g stroke="#232f3e" stroke-width="0.8" stroke-opacity="0.35">
    <rect x="52" y="70" width="144" height="144" fill="#e7ebec" />
    <path d="M70 70 V214 M88 70 V88 M88 106 V214 M106 70 V214 M124 70 V214 M142 70 V214 M160 70 V214 M178 70 V214" fill="none" />
    <path d="M52 88 H196 M52 106 H196 M52 124 H196 M52 142 H196 M52 160 H196 M52 178 H196 M52 196 H196" fill="none" />
  </g>
  <!-- the stroke the filters are there to find -->
  <g fill="#232f3e">
    <rect x="106" y="88" width="18" height="18" fill-opacity="0.85" />
    <rect x="106" y="106" width="18" height="18" fill-opacity="0.9" />
    <rect x="124" y="124" width="18" height="18" fill-opacity="0.8" />
    <rect x="124" y="142" width="18" height="18" fill-opacity="0.9" />
    <rect x="106" y="160" width="18" height="18" fill-opacity="0.75" />
    <rect x="88" y="178" width="18" height="18" fill-opacity="0.6" />
  </g>
  <!-- the 3x3 window of weights, sitting on the stroke: backed in white so
       the weights stay readable over the dark pixels underneath -->
  <rect x="105" y="105" width="56" height="56" fill="#ffffff" fill-opacity="0.78" stroke="#15803d" stroke-width="3" />
  <g font-family="monospace" font-size="12" fill="#15803d" text-anchor="middle">
    <text x="115" y="122">0</text><text x="133" y="122">-1</text><text x="151" y="122">0</text>
    <text x="115" y="140">-1</text><text x="133" y="140">4</text><text x="151" y="140">-1</text>
    <text x="115" y="158">0</text><text x="133" y="158">-1</text><text x="151" y="158">0</text>
  </g>
  <!-- it slides, and the answer lands in the map on the right -->
  <path d="M208 142 H244" fill="none" stroke="#232f3e" stroke-width="2" />
  <path d="M238 136 L246 142 L238 148" fill="none" stroke="#232f3e" stroke-width="2" />
  <rect x="256" y="88" width="108" height="108" fill="#ffffff" stroke="#232f3e" stroke-width="1.4" />
  <g fill="#15803d">
    <rect x="286" y="100" width="12" height="12" fill-opacity="0.85" />
    <rect x="286" y="112" width="12" height="12" fill-opacity="0.95" />
    <rect x="298" y="124" width="12" height="12" fill-opacity="0.8" />
    <rect x="298" y="136" width="12" height="12" fill-opacity="0.9" />
    <rect x="286" y="148" width="12" height="12" fill-opacity="0.7" />
    <rect x="274" y="160" width="12" height="12" fill-opacity="0.55" />
  </g>
  <rect x="298" y="124" width="12" height="12" fill="none" stroke="#15803d" stroke-width="2.4" />
  <g stroke="#232f3e" stroke-width="2">
    <line x1="40" y1="275" x2="360" y2="275" />
    <line x1="40" y1="275" x2="40" y2="25" />
  </g>
</svg>
