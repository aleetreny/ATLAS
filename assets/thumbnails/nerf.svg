<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#f1f3f3" />
  <!-- the still life the cameras are pointed at -->
  <ellipse cx="205" cy="200" rx="78" ry="17" fill="#b9bec9" />
  <g transform="translate(248 176) rotate(-14)">
    <ellipse cx="0" cy="0" rx="26" ry="21" fill="none" stroke="#158592" stroke-width="14" />
  </g>
  <circle cx="163" cy="172" r="27" fill="#db4039" />
  <circle cx="154" cy="163" r="8" fill="#ffffff" fill-opacity="0.5" />
  <path d="M191 196 l19 -11 v-25 l-19 11 z" fill="#c9971a" />
  <path d="M191 196 l19 -11 l19 11 l-19 11 z" fill="#a87d14" />
  <path d="M191 171 l19 -11 l19 11 l-19 11 z" fill="#eeb824" />
  <path d="M210 185 l19 -11 v25 l-19 11 z" fill="#d9a51d" />
  <!-- the cameras that took the photographs, each pointed at the still life -->
  <g fill="#232f3e">
    <path d="M0,-8 L13,0 L0,8 Z" transform="translate(78 120) rotate(21.5)" />
    <path d="M0,-8 L13,0 L0,8 Z" transform="translate(120 84) rotate(45.3)" />
    <path d="M0,-8 L13,0 L0,8 Z" transform="translate(200 58) rotate(87.4)" />
    <path d="M0,-8 L13,0 L0,8 Z" transform="translate(285 88) rotate(134.3)" />
    <path d="M0,-8 L13,0 L0,8 Z" transform="translate(322 124) rotate(158.5)" />
  </g>
  <g stroke="#232f3e" stroke-width="1" stroke-opacity="0.32">
    <line x1="90" y1="125" x2="180" y2="160" />
    <line x1="129" y1="93" x2="192" y2="152" />
    <line x1="201" y1="71" x2="205" y2="150" />
    <line x1="276" y1="97" x2="228" y2="148" />
    <line x1="310" y1="129" x2="244" y2="155" />
  </g>
  <!-- and the one that did not -->
  <path d="M0,-9 L15,0 L0,9 Z" transform="translate(100 232) rotate(-28.1)"
        fill="none" stroke="#581c87" stroke-width="2.4" />
  <g stroke="#581c87" stroke-width="2" stroke-dasharray="5 4">
    <line x1="116" y1="225" x2="176" y2="196" />
    <line x1="114" y1="219" x2="182" y2="180" />
  </g>
  <text x="200" y="262" font-family="monospace" font-size="11" fill="#232f3e" text-anchor="middle">photographs all round it, and the one nobody took</text>
  <g stroke="#232f3e" stroke-width="2">
    <line x1="20" y1="278" x2="380" y2="278" />
    <line x1="20" y1="278" x2="20" y2="40" />
  </g>
</svg>
