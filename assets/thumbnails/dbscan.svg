<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#f1f3f3" />
  <!-- two interleaved moons, found by chaining -->
  <g stroke="#ffffff" stroke-width="0.8">
    <g fill="#6d28d9">
      <circle cx="96" cy="130" r="5" /><circle cx="112" cy="106" r="5" /><circle cx="134" cy="88" r="5" />
      <circle cx="160" cy="78" r="5" /><circle cx="188" cy="76" r="5" /><circle cx="216" cy="84" r="5" />
      <circle cx="240" cy="98" r="5" /><circle cx="258" cy="118" r="5" /><circle cx="122" cy="128" r="5" />
      <circle cx="146" cy="104" r="5" /><circle cx="178" cy="94" r="5" /><circle cx="212" cy="102" r="5" />
      <circle cx="242" cy="122" r="5" />
    </g>
    <g fill="#df2a5d">
      <circle cx="150" cy="196" r="5" /><circle cx="168" cy="214" r="5" /><circle cx="192" cy="226" r="5" />
      <circle cx="220" cy="230" r="5" /><circle cx="248" cy="224" r="5" /><circle cx="272" cy="210" r="5" />
      <circle cx="290" cy="188" r="5" /><circle cx="166" cy="190" r="5" /><circle cx="196" cy="204" r="5" />
      <circle cx="228" cy="208" r="5" /><circle cx="258" cy="198" r="5" /><circle cx="282" cy="172" r="5" />
      <circle cx="302" cy="162" r="5" />
    </g>
  </g>
  <!-- the epsilon ball around one core point -->
  <circle cx="188" cy="76" r="34" fill="#6d28d9" fill-opacity="0.10" stroke="#6d28d9" stroke-width="2" stroke-dasharray="7 5" />
  <!-- noise: belongs to nothing, and says so -->
  <g stroke="#232f3e" stroke-width="1.4">
    <g fill="none">
      <circle cx="82" cy="226" r="5" /><circle cx="330" cy="92" r="5" /><circle cx="318" cy="248" r="5" />
    </g>
    <path d="M79 223 l6 6 M85 223 l-6 6" /><path d="M327 89 l6 6 M333 89 l-6 6" /><path d="M315 245 l6 6 M321 245 l-6 6" />
  </g>
  <g stroke="#232f3e" stroke-width="2">
    <line x1="40" y1="275" x2="360" y2="275" />
    <line x1="40" y1="275" x2="40" y2="25" />
  </g>
</svg>
