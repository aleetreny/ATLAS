<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#f1f3f3" />
  <!-- left: the perfect box, which is mostly not the garment -->
  <rect x="44" y="80" width="140" height="140" fill="#1a2432" />
  <rect x="64" y="96" width="100" height="108" fill="#ffffff" fill-opacity="0.14" />
  <path d="M84 96 h60 l-9 108 h-18 l-3 -62 l-3 62 h-18 z" fill="#e7ebec" />
  <rect x="64" y="96" width="100" height="108" fill="none" stroke="#ffffff" stroke-width="2" />
  <!-- arrow -->
  <path d="M196 150 H228" fill="none" stroke="#232f3e" stroke-width="2" />
  <path d="M222 144 L230 150 L222 156" fill="none" stroke="#232f3e" stroke-width="2" />
  <!-- right: which pixels, exactly -->
  <rect x="240" y="80" width="140" height="140" fill="#1a2432" />
  <path d="M280 96 h60 l-9 108 h-18 l-3 -62 l-3 62 h-18 z" fill="#e7ebec" />
  <path d="M280 96 h60 l-9 108 h-18 l-3 -62 l-3 62 h-18 z" fill="#c026d3" fill-opacity="0.62" />
  <path d="M280 96 h60 l-9 108 h-18 l-3 -62 l-3 62 h-18 z" fill="none" stroke="#c026d3" stroke-width="2" />
  <text x="200" y="252" font-family="monospace" font-size="11" fill="#232f3e" text-anchor="middle">a perfect box, and which pixels it gets wrong</text>
  <g stroke="#232f3e" stroke-width="2">
    <line x1="20" y1="275" x2="380" y2="275" />
    <line x1="20" y1="275" x2="20" y2="40" />
  </g>
</svg>
