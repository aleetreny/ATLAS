  <!-- the three rare ones, found, missed, found -->
  <g stroke="#232f3e" stroke-width="1.2">
    <circle cx="192" cy="88" r="6.5" fill="#0f766e" />
    <circle cx="288" cy="196" r="6.5" fill="#0f766e" />
    <circle cx="160" cy="160" r="6.5" fill="#df2a5d" />
  </g>
  <g stroke="#232f3e" stroke-width="2">
    <line x1="40" y1="275" x2="360" y2="275" />
    <line x1="40" y1="275" x2="40" y2="25" />
  </g>
