<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#f1f3f3" />
  <defs>
    <clipPath id="dlt-plot"><rect x="40" y="25" width="320" height="250" /></clipPath>
  </defs>
  <!-- the quilt, seen from an angle: the structure is still there, it just no
       longer lines up with anything a tree can cut along -->
  <g clip-path="url(#dlt-plot)">
    <g transform="rotate(-28 200 150)" stroke="#232f3e" stroke-opacity="0.25" stroke-width="1">
      <rect x="70" y="20" width="87" height="87" fill="#3b4cca" fill-opacity="0.18" />
      <rect x="157" y="20" width="87" height="87" fill="#ff9900" fill-opacity="0.22" />
      <rect x="244" y="20" width="87" height="87" fill="#3b4cca" fill-opacity="0.18" />
      <rect x="70" y="107" width="87" height="87" fill="#ff9900" fill-opacity="0.22" />
      <rect x="157" y="107" width="87" height="87" fill="#3b4cca" fill-opacity="0.18" />
      <rect x="244" y="107" width="87" height="87" fill="#ff9900" fill-opacity="0.22" />
      <rect x="70" y="194" width="87" height="87" fill="#3b4cca" fill-opacity="0.18" />
      <rect x="157" y="194" width="87" height="87" fill="#ff9900" fill-opacity="0.22" />
      <rect x="244" y="194" width="87" height="87" fill="#3b4cca" fill-opacity="0.18" />
    </g>
    <!-- the true boundary -->
    <line x1="52" y1="248" x2="348" y2="58" stroke="#232f3e" stroke-width="2"
          stroke-dasharray="7 6" opacity="0.5" />
    <!-- and what an axis-aligned model has to spend to follow it -->
    <path d="M60,240 L95,240 L95,217 L130,217 L130,195 L165,195 L165,172 L200,172
             L200,150 L235,150 L235,127 L270,127 L270,105 L305,105 L305,82 L340,82 L340,60"
          fill="none" stroke="#3b4cca" stroke-width="3.5" stroke-linejoin="miter" />
  </g>
  <g stroke="#232f3e" stroke-width="2">
    <line x1="40" y1="275" x2="360" y2="275" />
    <line x1="40" y1="275" x2="40" y2="25" />
  </g>
</svg>
