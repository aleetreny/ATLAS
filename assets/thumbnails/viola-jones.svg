<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#f1f3f3" />
  <!-- a face, schematically, with the classic two-band Haar feature across the eyes -->
  <ellipse cx="200" cy="150" rx="66" ry="82" fill="#d9dfe2" stroke="#232f3e" stroke-width="1.6" />
  <ellipse cx="177" cy="130" rx="9" ry="6" fill="#232f3e" />
  <ellipse cx="223" cy="130" rx="9" ry="6" fill="#232f3e" />
  <path d="M200 145 L200 168 L210 168" fill="none" stroke="#232f3e" stroke-width="1.6" />
  <path d="M178 190 Q200 202 222 190" fill="none" stroke="#232f3e" stroke-width="2" />
  <!-- the learned feature: dark band on the eyes, light band on the cheekbones -->
  <rect x="140" y="118" width="120" height="24" fill="#1e40af" fill-opacity="0.62" stroke="#232f3e" stroke-width="1.2" />
  <rect x="140" y="142" width="120" height="24" fill="#ffffff" fill-opacity="0.85" stroke="#232f3e" stroke-width="1.2" />
  <!-- the detection box, and the windows that died early -->
  <rect x="128" y="62" width="144" height="176" fill="none" stroke="#b91c1c" stroke-width="2.6" />
  <g fill="#1e40af" opacity="0.35">
    <rect x="60" y="50" width="3" height="3" /><rect x="80" y="70" width="3" height="3" />
    <rect x="60" y="120" width="3" height="3" /><rect x="86" y="180" width="3" height="3" />
    <rect x="64" y="220" width="3" height="3" /><rect x="100" y="240" width="3" height="3" />
    <rect x="310" y="60" width="3" height="3" /><rect x="330" y="110" width="3" height="3" />
    <rect x="300" y="170" width="3" height="3" /><rect x="336" y="210" width="3" height="3" />
    <rect x="306" y="248" width="3" height="3" /><rect x="286" y="86" width="3" height="3" />
  </g>
  <g stroke="#232f3e" stroke-width="2">
    <line x1="40" y1="275" x2="360" y2="275" />
    <line x1="40" y1="275" x2="40" y2="25" />
  </g>
</svg>
