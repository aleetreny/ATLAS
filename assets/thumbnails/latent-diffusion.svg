  <text x="166" y="252" text-anchor="middle" font-family="monospace" font-size="12" fill="#232f3e">4</text>
  <text x="266" y="252" text-anchor="middle" font-family="monospace" font-size="12" fill="#232f3e">8</text>
  <text x="366" y="252" text-anchor="middle" font-family="monospace" font-size="12" fill="#232f3e">16</text>
