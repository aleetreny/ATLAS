<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#f1f3f3" />
  <!-- honesty: claimed equals true -->
  <line x1="40" y1="275" x2="360" y2="25" stroke="#232f3e" stroke-width="1.8" stroke-dasharray="7 5" opacity="0.55" />
  <!-- the overconfident model, bowing far under the diagonal -->
  <path d="M 40 275 C 140 268, 240 252, 296 200 C 322 176, 344 120, 356 60"
        fill="none" stroke="#9f1239" stroke-width="4" />
  <g fill="#9f1239" stroke="#ffffff" stroke-width="1.6">
    <circle cx="72" cy="272" r="6" />
    <circle cx="136" cy="266" r="6" />
    <circle cx="200" cy="252" r="6" />
    <circle cx="262" cy="226" r="6" />
    <circle cx="308" cy="166" r="6" />
    <circle cx="344" cy="94" r="6" />
  </g>
  <!-- the repaired model, pulled back onto the line -->
  <g fill="#f1f3f3" stroke="#9f1239" stroke-width="3">
    <circle cx="104" cy="226" r="5.5" />
    <circle cx="168" cy="176" r="5.5" />
    <circle cx="232" cy="126" r="5.5" />
    <circle cx="296" cy="76" r="5.5" />
  </g>
  <g stroke="#232f3e" stroke-width="2">
    <line x1="40" y1="275" x2="360" y2="275" />
    <line x1="40" y1="275" x2="40" y2="25" />
  </g>
</svg>
